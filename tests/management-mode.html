<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>管理モード永続化テスト</title>
  </head>
  <body>
    <h1>管理モード永続化テスト</h1>
    <pre id="result">実行中…</pre>
    <script>
      const result = document.querySelector("#result");
      const keys = {
        answers: "benkyo-tool-prompt01:response-values:v1",
        completed: "benkyo-tool-prompt01:completed-problems:v1",
        history: "benkyo-tool-prompt01:response-history:v1",
        view: "benkyo-tool-prompt01:view-selection:v1",
        reading: "benkyo-tool-prompt01:reading-view-mode:v1",
      };
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const assert = (condition, label) => {
        if (!condition) throw new Error(label);
      };
      const type = (doc, text) => {
        for (const key of text) doc.body.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true }));
      };
      const stored = () => Object.fromEntries(
        Object.values(keys).map((key) => [key, localStorage.getItem(key)]),
      );

      // Seed an existing normal answer and history before the application boots.
      localStorage.setItem(keys.answers, JSON.stringify({ p008: { proportional: "A" } }));
      localStorage.setItem(keys.completed, JSON.stringify({}));
      localStorage.setItem(keys.history, JSON.stringify({
        undoStack: [{ sentinel: "undo" }],
        redoStack: [{ sentinel: "redo" }],
      }));
      localStorage.setItem(keys.view, JSON.stringify({ datasetId: "core-math", pageKey: "all" }));
      localStorage.setItem(keys.reading, JSON.stringify("default"));

      const iframe = document.createElement("iframe");
      iframe.title = "Study Tool test instance";
      iframe.style.cssText = "position:absolute;width:1280px;height:900px;left:-10000px";
      document.body.append(iframe);
      iframe.addEventListener("load", async () => {
        try {
          const win = iframe.contentWindow;
          const doc = iframe.contentDocument;
          for (let i = 0; i < 100 && !doc.querySelector(".problem-card"); i += 1) await wait(100);
          win.matchMedia = () => ({ matches: true });
          Object.defineProperty(win, "innerWidth", { configurable: true, value: 1280 });

          let card = [...doc.querySelectorAll(".problem-card")]
            .find((node) => node.textContent.includes("p008"));
          assert(card && card.querySelectorAll("input[type=text]")[0].value === "A", "既存回答を読み込む");
          const beforeAdmin = stored();
          const baselineAnswers = JSON.parse(beforeAdmin[keys.answers]);

          doc.activeElement.blur();
          type(doc, "manage");
          const password = doc.querySelector("#management-password");
          password.value = "hogepiyo123";
          doc.querySelector("#management-form").dispatchEvent(
            new Event("submit", { bubbles: true, cancelable: true }),
          );
          assert(!doc.querySelector("#management-exit").hidden, "管理モード終了ボタンを表示");
          assert(doc.querySelector("#undo-clear").disabled && doc.querySelector("#redo-clear").disabled, "履歴操作を停止");

          card = [...doc.querySelectorAll(".problem-card")]
            .find((node) => node.textContent.includes("p008"));
          card.querySelector(".problem-completion-input").click();
          card = [...doc.querySelectorAll(".problem-card")]
            .find((node) => node.textContent.includes("p008"));
          assert(JSON.stringify(stored()) === JSON.stringify(beforeAdmin), "管理完了でlocalStorageを変更しない");
          assert(card.querySelectorAll("input[type=text]")[0].value === "ア", "一時正答を画面に表示");
          assert(card.querySelector(".problem-completion-input").checked, "一時完了を画面に反映");

          doc.querySelector("#toggle-transfer-mode").click();
          assert([...doc.querySelectorAll(".transfer-meta")]
            .some((node) => node.textContent.includes("p008")), "転記一覧に一時完了を表示");
          assert(!doc.querySelector("#print-transfer").disabled, "印刷対象として有効");
          doc.querySelector("#toggle-transfer-mode").click();
          doc.querySelector("#management-exit").click();
          assert(JSON.stringify(stored()) === JSON.stringify(beforeAdmin), "終了時もlocalStorageを変更しない");
          card = [...doc.querySelectorAll(".problem-card")]
            .find((node) => node.textContent.includes("p008"));
          assert(card.querySelectorAll("input[type=text]")[0].value === "A", "終了時に開始前回答へ復元");
          assert(!card.querySelector(".problem-completion-input").checked, "終了時に開始前完了へ復元");
          assert(JSON.stringify(JSON.parse(win.localStorage.getItem(keys.history))) === JSON.stringify({
            undoStack: [{ sentinel: "undo" }],
            redoStack: [{ sentinel: "redo" }],
          }), "終了時に開始前履歴へ復元");

          const otherCard = [...doc.querySelectorAll(".problem-card")]
            .find((node) => !node.textContent.includes("p008") && node.querySelector('input[type="text"]'));
          assert(otherCard, "通常回答用の別問題を表示");
          const otherInput = otherCard.querySelector('input[type="text"]');
          otherInput.value = "C";
          otherInput.dispatchEvent(new Event("input", { bubbles: true }));
          let answers = JSON.parse(win.localStorage.getItem(keys.answers));
          assert(JSON.stringify(answers.p008) === JSON.stringify(baselineAnswers.p008)
            && Object.keys(answers).some((key) => key !== "p008"),
            "別問題の通常保存に管理回答を混入しない");

          const beforeReload = stored();
          doc.activeElement.blur();
          type(doc, "manage");
          password.value = "hogepiyo123";
          doc.querySelector("#management-form").dispatchEvent(
            new Event("submit", { bubbles: true, cancelable: true }),
          );
          card = [...doc.querySelectorAll(".problem-card")]
            .find((node) => node.textContent.includes("p008"));
          card.querySelector(".problem-completion-input").click();
          assert(JSON.stringify(stored()) === JSON.stringify(beforeReload), "管理中の変更を再読み込み前も保存しない");

          const reloaded = new Promise((resolve) => iframe.addEventListener("load", resolve, { once: true }));
          win.location.reload();
          await reloaded;
          for (let i = 0; i < 100 && !iframe.contentDocument.querySelector(".problem-card"); i += 1) await wait(100);
          const reloadedDoc = iframe.contentDocument;
          card = [...reloadedDoc.querySelectorAll(".problem-card")]
            .find((node) => node.textContent.includes("p008"));
          answers = JSON.parse(localStorage.getItem(keys.answers));
          assert(JSON.stringify(answers.p008) === JSON.stringify(baselineAnswers.p008)
            && Object.keys(answers).some((key) => key !== "p008"),
            "F5後は最後の通常保存状態を読み込む");
          assert(!JSON.parse(localStorage.getItem(keys.completed))["core-math::6::p008"], "F5で一時完了を破棄");
          assert(!card.querySelector(".problem-completion-input").checked, "F5後に未完了UIへ戻る");
          assert(reloadedDoc.querySelector("#management-exit").hidden, "F5で管理モードを終了");
          result.textContent = "PASS: 一時保存・転記/印刷・終了時復元・後続保存の隔離・F5破棄";
        } catch (error) {
          result.textContent = `FAIL: ${error.stack ?? error}`;
        }
        iframe.remove();
      }, { once: true });
      iframe.src = "../app/index.html";
    </script>
  </body>
</html>
