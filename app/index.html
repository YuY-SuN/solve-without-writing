<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>勉強ツール</title>
    <link rel="stylesheet" href="./src/styles/page.css?v20261009-1" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Study Tool</p>
          <h1 id="app-title">勉強ツール</h1>
          <p id="app-source" class="meta-line"></p>
        </div>
        <div class="toolbar">
          <label class="toolbar-field">
            <span>教科</span>
            <select id="subject-select"></select>
          </label>
          <label class="toolbar-field toolbar-field-wide">
            <span>問題セット</span>
            <select id="dataset-select"></select>
          </label>
          <label class="toolbar-field">
            <span>ページ</span>
            <select id="page-filter"></select>
          </label>
          <button id="clear-visible" type="button">表示中をクリア</button>
          <button id="undo-clear" type="button">ひとつもどる</button>
          <button id="redo-clear" type="button">ひとつすすむ</button>
          <button id="management-exit" type="button" hidden>管理モード終了</button>
          <button id="toggle-transfer-mode" type="button">転記モード</button>
          <button id="toggle-transfer-content" type="button">転記内容: 入力内容</button>
          <button id="print-transfer" type="button">転記を印刷</button>
          <button id="export-storage" type="button">記憶を書き出す</button>
          <button id="import-storage" type="button">記憶を読み込む</button>
          <input id="import-storage-file" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <div id="management-dialog" class="management-dialog-backdrop" hidden>
        <section class="management-dialog" role="dialog" aria-modal="true" aria-labelledby="management-title">
          <form id="management-form">
            <h2 id="management-title">管理モード</h2>
            <label for="management-password">パスワード</label>
            <input id="management-password" type="password" autocomplete="off" required />
            <p id="management-message" class="management-message" aria-live="polite"></p>
            <div class="management-dialog-actions">
              <button type="submit">開始</button>
              <button id="management-cancel" type="button" class="secondary-button">キャンセル</button>
            </div>
          </form>
        </section>
      </div>

      <p id="storage-transfer-status" class="toolbar-status" aria-live="polite"></p>

      <main>
        <section class="page-progress-panel" aria-live="polite">
          <div id="page-progress" class="page-progress-list"></div>
        </section>
        <section id="problem-list" class="problem-list" aria-live="polite"></section>
      </main>
    </div>

    <script type="module" src="./src/main.js?v20261008-5"></script>
  </body>
</html>
